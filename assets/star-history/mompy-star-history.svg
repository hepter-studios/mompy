<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Mompy star history</title>
  <desc id="desc">GitHub star history chart for hepter-studios/mompy with 1 star.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101510"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .label { fill: #d8e2d2; font: 600 18px Inter, Segoe UI, Arial, sans-serif; }
    .small { fill: #94a391; font: 500 14px Inter, Segoe UI, Arial, sans-serif; }
    .title { fill: #f2fff0; font: 800 30px Inter, Segoe UI, Arial, sans-serif; }
    .axis { stroke: #dce7d8; stroke-width: 3; stroke-linecap: round; }
    .grid line { stroke: #223322; stroke-width: 1; }
    .line { fill: none; stroke: #ff5a62; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="100%" height="100%" rx="22" fill="url(#bg)"/>
  <rect x="18" y="18" width="864" height="484" rx="18" fill="none" stroke="#243324"/>
  <text class="title" x="450.0" y="58" text-anchor="middle">Star History</text>
  <text class="small" x="864" y="64" text-anchor="end">Updated 2026-08-06</text>
  <g class="grid">
    <line x1="86" y1="448.00" x2="854" y2="448.00" /><line x1="86" y1="336.00" x2="854" y2="336.00" /><line x1="86" y1="224.00" x2="854" y2="224.00" /><line x1="86" y1="112.00" x2="854" y2="112.00" />
  </g>
  <line class="axis" x1="86" y1="112" x2="86" y2="448"/>
  <line class="axis" x1="86" y1="448" x2="854" y2="448"/>
  <g class="small">
    <text x="68" y="453.00" text-anchor="end">0</text><text x="68" y="341.00" text-anchor="end">1</text><text x="68" y="229.00" text-anchor="end">2</text><text x="68" y="117.00" text-anchor="end">3</text>
    <text x="86.00" y="492" text-anchor="middle">Jun 13</text><text x="242.44" y="492" text-anchor="middle">Jun 24</text><text x="398.89" y="492" text-anchor="middle">Jul 05</text><text x="541.11" y="492" text-anchor="middle">Jul 15</text><text x="697.56" y="492" text-anchor="middle">Jul 26</text><text x="854.00" y="492" text-anchor="middle">Aug 06</text>
  </g>
  <text class="label" x="32" y="280.0" transform="rotate(-90 32 280.0)" text-anchor="middle">GitHub Stars</text>
  <polyline class="line" points="86.00,448.00 100.22,336.00 854.00,336.00" filter="url(#softGlow)"/>
  <g transform="translate(106 130)">
    <rect width="282" height="44" rx="10" fill="#101510" stroke="#dce7d8" stroke-width="2"/>
    <rect x="16" y="15" width="14" height="14" rx="3" fill="#ff5a62"/>
    <text class="label" x="42" y="29">hepter-studios/mompy</text>
  </g>
