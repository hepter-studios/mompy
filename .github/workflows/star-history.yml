name: Star History

on:
  schedule:
    - cron: "0 6 * * *"
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Mompy star history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAR_HISTORY_REPO: hepter-studios/mompy
        run: python .github/scripts/render_star_history.py

      - name: Commit generated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history/mompy-star-history.svg
          if git diff --cached --quiet; then
            echo "No star history changes."
            exit 0
          fi
          git commit -m "chore: update star history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
