name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and validate Windows packages
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify backend before build
        shell: pwsh
        run: |
          python -m unittest discover -s tests
          node --check frontend/js/app.js
          python main.py --check

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }

      - name: Build app, portable zip, and installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows_installer.ps1

      - name: Smoke test installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_windows_installer.ps1

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mompy-Windows
          path: |
            dist/MompySetup-v*.exe
            dist/Mompy-windows-x64.zip
          if-no-files-found: error

      - name: Attach packages to tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Mompy $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create GitHub release $tag."
            }
          }
          gh release upload $tag dist/MompySetup-v*.exe dist/Mompy-windows-x64.zip --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload Windows packages to GitHub release $tag."
          }
